<div class="flex justify-center items-center min-h-screen bg-surface-ground p-4">
  <p-card styleClass="w-full max-w-md bg-surface-card border-surface-border">
    <ng-template pTemplate="header">
      <div class="text-center p-4">
        <h2 class="text-2xl font-bold text-primary-color">Welcome Back</h2>
        <p class="text-surface-border">Sign in to your KnowPhysics account</p>
      </div>
    </ng-template>
    
    <ng-template pTemplate="content">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- Email -->
        <div class="field">
          <label for="email" class="block text-sm font-medium mb-2">Email</label>
          <input 
            id="email" 
            pInputText 
            formControlName="email" 
            type="email"
            placeholder="Enter your email"
            class="w-full" />
          <small *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" 
                 class="p-error block">
            Enter a valid email.
          </small>
        </div>

        <!-- Password -->
        <div class="field">
          <label for="password" class="block text-sm font-medium mb-2">Password</label>
          <p-password 
            id="password" 
            formControlName="password" 
            placeholder="Enter your password"
            [toggleMask]="true"
            styleClass="w-full">
          </p-password>
          <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" 
                 class="p-error block">
            Password is required.
          </small>
        </div>

        <!-- Submit Button -->
        <p-button 
          type="submit" 
          label="Sign In" 
          icon="pi pi-sign-in"
          [disabled]="loginForm.invalid"
          styleClass="w-full">
        </p-button>

        <!-- Sign Up Link -->
        <div class="text-center pt-4">
          <p class="text-surface-border">Don't have an account?</p>
          <p-button 
            label="Create Account" 
            icon="pi pi-user-plus"
            styleClass="p-button-link p-0"
            routerLink="/signup">
          </p-button>
        </div>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="p-3 bg-red-100 border border-red-400 text-red-700 rounded">
          {{ errorMessage }}
        </div>
      </form>
    </ng-template>
  </p-card>
  
  <p-toast></p-toast>
</div>
