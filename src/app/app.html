<div class="flex h-screen flex-col">
  <header class="flex justify-between items-center bg-gray-900 text-white p-4">
    <a routerLink="/" class="flex items-center text-white">
      <img src="assets/logo.png" alt="Logo" class="h-12 w-12 mr-2">
      <h2 class="text-2xl font-bold">TheOnlyPhysics</h2>
    </a>
  <nav class="flex flex-col space-y-1 text-right">
      <a routerLink="/signup" class="hover:underline">sign up</a>
      <span> </span>
      <a routerLink="/login" class="hover:underline">login</a>
    </nav>
  </header>
  <div class="flex flex-1 overflow-hidden">
    <aside class="w-72 bg-gray-900 text-white p-4 overflow-y-auto">
      <app-sidebar [formulas]="formulas"></app-sidebar>
    </aside>
    <main class="flex-1 p-8 bg-gray-800 text-white overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
