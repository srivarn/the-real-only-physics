<div class="app-shell">
  <header class="header">
    <p-button icon="pi pi-bars" styleClass="p-button-text mobile-menu-btn"
              (click)="toggleMobileMenu()" pTooltip="Toggle menu" aria-label="Toggle menu">
    </p-button>
    <div class="logo-container">
      <img src="assets/file.svg" alt="KnowPhysics Logo" class="logo-image"
           loading="eager" onerror="this.style.display='none'">
      <h2>KnowPhysics</h2>
    </div>

    <!-- Header spacer -->
    <div style="flex:1"></div>

    <!-- Theme toggle -->
    <p-button
      [icon]="isDark ? 'pi pi-sun' : 'pi pi-moon'"
      styleClass="p-button-text theme-toggle-btn"
      [pTooltip]="isDark ? 'Switch to light mode' : 'Switch to dark mode'"
      (click)="toggleTheme()">
    </p-button>
  </header>

  <div class="body-layout">
    <div class="mobile-overlay" [class.active]="mobileMenuOpen" (click)="toggleMobileMenu()"></div>

    <aside class="sidebar" [class.collapsed]="sidebarCollapsed" [class.mobile-open]="mobileMenuOpen">
      <p-button icon="pi pi-times" styleClass="p-button-text mobile-close-btn"
                (click)="toggleMobileMenu()" aria-label="Close menu">
      </p-button>
      <app-sidebar></app-sidebar>
    </aside>

    <main class="main-content">
      <div class="page-content">
        <router-outlet></router-outlet>
      </div>
      <footer class="site-footer">
        <span>© 2025 KnowPhysics &middot;
          <a href="mailto:knowphysics197&#64;gmail.com?subject=KnowPhysics%20Contact&body=Hello%20KnowPhysics%20Team,">
            knowphysics197&#64;gmail.com
          </a>
        </span>
        <a href="mailto:knowphysics197&#64;gmail.com?subject=KnowPhysics%20Feedback&body=I%20would%20like%20to%20share%20feedback:">
          Send feedback
        </a>
      </footer>
    </main>
  </div>

  <p-button *ngIf="showTop" icon="pi pi-arrow-up"
            styleClass="p-button-text scroll-top"
            (click)="toTop()" pTooltip="Back to top">
  </p-button>
</div>
