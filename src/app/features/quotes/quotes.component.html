<h1 class="mb-4">Quotes</h1>
<div class="grid gap-3">
  <p-card *ngFor="let quote of quotes">
    <ng-template pTemplate="content">
      <blockquote>“{{ quote.text }}”</blockquote>
      <p>— {{ quote.author }}</p>
      <p-button [label]="isPinned(quote.id) ? 'Unpin' : 'Pin'" styleClass="p-button-outlined" (click)="togglePin(quote)"></p-button>
    </ng-template>
  </p-card>
</div>
