<div class="experiments-container" pAnimateOnScroll enterClass="fadeinup">
  <div class="experiments-header">
    <h1 class="text-4xl font-bold mb-4">Home Physics Experiments</h1>
    <p class="text-xl text-surface-border mb-8">Hands-on experiments with safety tips and progress tracking.</p>
  </div>

  <div class="filters-section mb-8 grid grid-cols-1 md:grid-cols-3 gap-4">
    <input pInputText [(ngModel)]="searchTerm" (input)="filterExperiments()" placeholder="Search experiments..." class="w-full" />
    <p-dropdown [(ngModel)]="selectedCategory" [options]="categories" (onChange)="filterExperiments()" optionLabel="label" optionValue="value"></p-dropdown>
    <p-dropdown [(ngModel)]="selectedDifficulty" [options]="difficulties" (onChange)="filterExperiments()" optionLabel="label" optionValue="value"></p-dropdown>
  </div>

  <div class="experiments-grid">
    <div *ngFor="let experiment of filteredExperiments" class="experiment-card">
      <p-card styleClass="h-full">
        <ng-template pTemplate="content">
          <h3>{{ experiment.title }}</h3>
          <p-tag [value]="experiment.difficulty" [severity]="getDifficultyColor(experiment.difficulty)"></p-tag>
          <p>{{ experiment.description }}</p>
          <p><strong>Progress:</strong> {{ progress[experiment.id] || 0 }}%</p>
          <p-accordion>
            <p-accordionTab header="Safety Tips"><ul><li *ngFor="let s of experiment.safetyNotes">{{ s }}</li></ul></p-accordionTab>
            <p-accordionTab header="Materials"><ul><li *ngFor="let m of experiment.materials">{{ m }}</li></ul></p-accordionTab>
          </p-accordion>
        </ng-template>
        <ng-template pTemplate="footer">
          <div class="actions"><p-button label="Start experiment" icon="pi pi-play" (click)="startExperiment(experiment.id)"></p-button><p-button label="Open details" styleClass="p-button-outlined" [routerLink]="['/experiments', experiment.id]"></p-button></div>
        </ng-template>
      </p-card>
    </div>
  </div>
</div>
